<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- One shared diagram: the default view is Chinese; #en selects English labels. -->
  <view id="en" viewBox="0 0 800 400"/>
  <style>
    .label-en { display: none; }
    #en:target ~ .diagram .label-zh { display: none; }
    #en:target ~ .diagram .label-en { display: inline; }
  </style>
  <g class="diagram">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  
  <!-- 標題 -->
  <text x="400" y="35" fill="#f1f5f9" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif"><tspan class="label-zh">語意化顏色的運作流程</tspan><tspan class="label-en">How Semantic Colors Work</tspan></text>

  <!-- Step 1: HTML 結構 -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="220" height="130" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="110" y="25" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif"><tspan class="label-zh">Step 1: HTML 結構</tspan><tspan class="label-en">Step 1: HTML Structure</tspan></text>
    
    <!-- 亮色模式 -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="90" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="45" y="18" fill="#1e293b" font-size="10" text-anchor="middle" font-family="monospace">&lt;html&gt;</text>
      <text x="45" y="35" fill="#64748b" font-size="9" text-anchor="middle" font-family="system-ui"><tspan class="label-zh">無 .dark class</tspan><tspan class="label-en">No .dark class</tspan></text>
      <circle cx="45" cy="55" r="12" fill="#fbbf24"/>
      <text x="45" y="59" fill="#1e293b" font-size="10" text-anchor="middle">☀️</text>
    </g>
    
    <!-- 暗色模式 -->
    <g transform="translate(120, 40)">
      <rect x="0" y="0" width="90" height="75" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="45" y="18" fill="#f1f5f9" font-size="10" text-anchor="middle" font-family="monospace">&lt;html class="dark"&gt;</text>
      <text x="45" y="35" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui"><tspan class="label-zh">有 .dark class</tspan><tspan class="label-en">With .dark class</tspan></text>
      <circle cx="45" cy="55" r="12" fill="#6366f1"/>
      <text x="45" y="59" fill="white" font-size="10" text-anchor="middle">🌙</text>
    </g>
  </g>

  <!-- 箭頭 1 -->
  <path d="M 260 125 L 290 125" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2: CSS 變數查找 -->
  <g transform="translate(300, 60)">
    <rect x="0" y="0" width="200" height="130" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="100" y="25" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif"><tspan class="label-zh">Step 2: CSS 變數查找</tspan><tspan class="label-en">Step 2: CSS Variable Lookup</tspan></text>
    
    <rect x="10" y="40" width="180" height="75" rx="6" fill="#312e81"/>
    <text x="100" y="60" fill="#a5b4fc" font-size="10" text-anchor="middle" font-family="monospace">bg-background</text>
    <text x="100" y="78" fill="#c4b5fd" font-size="10" text-anchor="middle" font-family="monospace">↓</text>
    <text x="100" y="95" fill="#fbbf24" font-size="10" text-anchor="middle" font-family="monospace">var(--background)</text>
  </g>

  <!-- 箭頭 2 -->
  <path d="M 510 125 L 540 125" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 3: 結果 -->
  <g transform="translate(550, 60)">
    <rect x="0" y="0" width="220" height="130" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="110" y="25" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif"><tspan class="label-zh">Step 3: 取得顏色值</tspan><tspan class="label-en">Step 3: Resolve the Color</tspan></text>
    
    <!-- 亮色結果 -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="90" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="45" y="20" fill="#1e293b" font-size="9" text-anchor="middle" font-family="system-ui"><tspan class="label-zh">從 :root 取得</tspan><tspan class="label-en">From :root</tspan></text>
      <rect x="15" y="30" width="60" height="30" rx="4" fill="white" stroke="#e2e8f0"/>
      <text x="45" y="50" fill="#1e293b" font-size="9" text-anchor="middle" font-family="monospace">white</text>
    </g>
    
    <!-- 暗色結果 -->
    <g transform="translate(120, 40)">
      <rect x="0" y="0" width="90" height="75" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="45" y="20" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui"><tspan class="label-zh">從 .dark 取得</tspan><tspan class="label-en">From .dark</tspan></text>
      <rect x="15" y="30" width="60" height="30" rx="4" fill="#1a1a1a" stroke="#334155"/>
      <text x="45" y="50" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">#1a1a1a</text>
    </g>
  </g>

  <!-- 關鍵說明 -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="740" height="150" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="370" y="30" fill="#86efac" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif"><tspan class="label-zh">🔑 關鍵原理：CSS 變數的覆蓋機制</tspan><tspan class="label-en">🔑 Key Idea: CSS Variable Overrides</tspan></text>
    
    <!-- 左邊：亮色模式 -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="340" height="80" rx="6" fill="#166534"/>
      <text x="170" y="20" fill="#bbf7d0" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif"><tspan class="label-zh">☀️ 亮色模式（無 .dark class）</tspan><tspan class="label-en">☀️ Light Mode (No .dark Class)</tspan></text>
      <text x="20" y="45" fill="#86efac" font-size="11" font-family="monospace">:root { --background: white; }</text>
      <text x="20" y="65" fill="#4ade80" font-size="10" font-family="system-ui"><tspan class="label-zh">→ 瀏覽器使用 :root 定義的值</tspan><tspan class="label-en">→ The browser uses the value defined in :root</tspan></text>
    </g>
    
    <!-- 右邊：暗色模式 -->
    <g transform="translate(380, 50)">
      <rect x="0" y="0" width="340" height="80" rx="6" fill="#166534"/>
      <text x="170" y="20" fill="#bbf7d0" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif"><tspan class="label-zh">🌙 暗色模式（有 .dark class）</tspan><tspan class="label-en">🌙 Dark Mode (With .dark Class)</tspan></text>
      <text x="20" y="45" fill="#86efac" font-size="11" font-family="monospace">.dark { --background: #1a1a1a; }</text>
      <text x="20" y="65" fill="#4ade80" font-size="10" font-family="system-ui"><tspan class="label-zh">→ .dark 的定義覆蓋 :root 的值</tspan><tspan class="label-en">→ The .dark definition overrides the :root value</tspan></text>
    </g>
  </g>
  </g>
</svg>
